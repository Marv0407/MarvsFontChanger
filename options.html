<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Marv's Font Changer – Einstellungen</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="karte">
    <div class="icon-kreis">🔑</div>
    <h1>System-Schriftarten freischalten</h1>
    <p>
      Chrome benötigt deine Erlaubnis in einem eigenen Tab, um auf die auf
      deinem Gerät installierten Schriftarten zugreifen zu können. Das
      passiert nur lokal – es werden keine Daten übertragen.
    </p>
    <button id="freischaltenButton" class="primaer-button">
      Zugriff erlauben &amp; Schriften laden
    </button>
    <div id="statusText" class="status-text"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
